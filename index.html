<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radical Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="navbar">

    <div class="logo">
      RADICAL LIFE.
    </div>

    <ul class="nav-links">
      <li><a href="#">Início</a></li>
      <li><a href="#">Produtos</a></li>
      <li><a href="#">Coleções</a></li>
      <li><a href="#">Contato</a></li>
    </ul>

    <button class="shop-btn">
      SHOP NOW
    </button>
  </nav>

  
  <section class="hero">
    <div class="hero-left">
      <span class="tag">
        STREETWEAR & SKATE
      </span>

      <h1>
        VIVA A<br>
        RADICAL<br>
        LIFE.
      </h1>

      <p>
        Skate, atitude e streetwear acessível para quem vive a cultura urbana de verdade.
      </p>

      <div class="hero-buttons">
        <button class="primary-btn">
          NOVA COLEÇÃO
        </button>

        <button class="secondary-btn">
          EXPLORAR
        </button>
      </div>
    </div>

    <div class="hero-right">
      <div class="image-card">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop" alt="Skater">
      </div>

      <div class="floating-card card-1">
        NEW DROP
      </div>

      <div class="floating-card card-2">
        LIMITED
      </div>
    </div>
  </section>


  <div class="marquee">
    <div class="marquee-content">
      SKATE HARD • STREETWEAR • NEW DROP • RADICAL LIFE • FREE SHIPPING •
    </div>
  </div>

</body>
</html>
